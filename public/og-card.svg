<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Election Scenario Playground</title>
  <desc id="description">Social preview for an interactive President, House, and Senate scenario simulator.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#101f38"/>
      <stop offset="1" stop-color="#251528"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="0.5" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#f05b67"/>
    </linearGradient>
    <linearGradient id="democratic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67a7ff"/>
      <stop offset="1" stop-color="#2d67d8"/>
    </linearGradient>
    <linearGradient id="republican" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8b92"/>
      <stop offset="1" stop-color="#c53e4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020711" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1090" cy="-10" r="280" fill="#cf4050" opacity="0.08"/>
  <circle cx="60" cy="630" r="310" fill="#3878e8" opacity="0.09"/>
  <path d="M0 92H1200" stroke="url(#rule)" stroke-width="4"/>

  <g transform="translate(74 58)">
    <rect width="56" height="56" rx="14" fill="#f7f9fd"/>
    <path d="M8 16h40v28H8z" fill="#fff" stroke="#152238" stroke-width="2.5"/>
    <path d="M10 18h18v24H10z" fill="#3779e5"/>
    <path d="M28 18h18v24H28z" fill="#d94b58"/>
    <path d="M16 25h7v10h-7zM34 25h7v10h-7z" fill="#fff" opacity="0.9"/>
  </g>

  <text x="150" y="84" fill="#a8b8ce" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="3.2">INTERACTIVE ELECTION LAB</text>

  <text x="74" y="210" fill="#f7f9fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="76" font-weight="780" letter-spacing="-2.7">Election</text>
  <text x="358" y="210" fill="#f7f9fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="76" font-weight="780" letter-spacing="-2.7">Scenario</text>
  <text x="74" y="292" fill="#f7f9fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="76" font-weight="780" letter-spacing="-2.7">Playground</text>
  <text x="78" y="352" fill="#b8c5d7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">Build a scenario. See what moves.</text>

  <g transform="translate(76 408)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <g>
      <rect width="170" height="58" rx="29" fill="#182b49" stroke="#36557d"/>
      <circle cx="31" cy="29" r="9" fill="#68a8ff"/>
      <text x="52" y="37" fill="#e9eff8" font-size="22" font-weight="650">President</text>
    </g>
    <g transform="translate(186)">
      <rect width="140" height="58" rx="29" fill="#182b49" stroke="#36557d"/>
      <circle cx="31" cy="29" r="9" fill="#d9e0eb"/>
      <text x="52" y="37" fill="#e9eff8" font-size="22" font-weight="650">House</text>
    </g>
    <g transform="translate(342)">
      <rect width="148" height="58" rx="29" fill="#182b49" stroke="#36557d"/>
      <circle cx="31" cy="29" r="9" fill="#ff838c"/>
      <text x="52" y="37" fill="#e9eff8" font-size="22" font-weight="650">Senate</text>
    </g>
  </g>

  <g transform="translate(742 152)" filter="url(#shadow)">
    <rect width="382" height="376" rx="34" fill="#f7f9fd"/>
    <text x="34" y="55" fill="#53637a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="750" letter-spacing="2">SCENARIO BALANCE</text>
    <text x="34" y="101" fill="#152238" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="750">Electoral votes</text>

    <rect x="34" y="128" width="314" height="30" rx="15" fill="#dfe6f0"/>
    <path d="M49 128h151v30H49a15 15 0 0 1 0-30z" fill="url(#democratic)"/>
    <path d="M200 128h133a15 15 0 0 1 0 30H200z" fill="url(#republican)"/>
    <line x1="191" y1="119" x2="191" y2="168" stroke="#172238" stroke-width="3"/>
    <text x="34" y="190" fill="#2d67d8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="36" font-weight="800">270</text>
    <text x="348" y="190" text-anchor="end" fill="#c53e4a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="36" font-weight="800">268</text>

    <path d="M34 238H348" stroke="#d9e1ec"/>
    <text x="34" y="278" fill="#53637a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">NATIONAL SWING</text>
    <text x="348" y="280" text-anchor="end" fill="#2d67d8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="25" font-weight="800">D +1.8</text>
    <rect x="34" y="305" width="314" height="12" rx="6" fill="#d7dfeb"/>
    <rect x="34" y="305" width="182" height="12" rx="6" fill="#4c88ef"/>
    <circle cx="216" cy="311" r="15" fill="#fff" stroke="#2d67d8" stroke-width="6"/>
  </g>

  <text x="76" y="574" fill="#8192aa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20">Transparent assumptions · Historical replay · Shareable scenarios</text>
</svg>
